
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    upstream nextjs_app {
        server 127.0.0.1:3000; # Assuming your Next.js app runs on port 3000
    }

    server {
        listen 80;
        server_name localhost; # Replace with your domain name

        location / {
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Location for Server-Sent Events (SSE)
        location ~ ^/api/(sse|events) { # Adjust regex if your SSE endpoint is different
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Connection ''; # Important for SSE to prevent buffering
            proxy_buffering off; # Important for SSE to prevent buffering
            proxy_cache_bypass $http_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s; # Adjust as needed for long-lived SSE connections
        }
    }
}
